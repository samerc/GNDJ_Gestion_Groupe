<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c2b4a" />
    <meta name="description" content="Groupe scout Notre-Dame de Jamhour — au service de la jeunesse du Liban depuis 1935. Découvrez nos unités, nos actualités et rejoignez-nous." />
    <title>Groupe Notre-Dame de Jamhour</title>
    <!-- Static Open Graph / Twitter floor for social shares. Per-route pages refine title/description at
         runtime via the <Seo> component (React 19 document metadata); social scrapers that don't run JS
         fall back to these. og:image is the favicon as a minimal floor until a real share image exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Groupe Notre-Dame de Jamhour" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Groupe Notre-Dame de Jamhour" />
    <meta property="og:description" content="Groupe scout Notre-Dame de Jamhour — au service de la jeunesse du Liban depuis 1935." />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <!-- Apply the saved theme BEFORE first paint (no flash). EXTERNAL file (not inline): the production CSP is
         `script-src 'self'` with no 'unsafe-inline', which blocks an inline <script> — that made the theme
         revert to light on refresh in prod. A same-origin external script is allowed. Mirrors stores/theme-store.ts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
