services:
  db:
    image: postgres:18
    container_name: gndj_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gndj
      POSTGRES_USER: gndj_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-GndjDev2026!}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gndj_admin -d gndj"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gndj_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gndj.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
