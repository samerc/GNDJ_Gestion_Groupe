<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Auto-retry: the page reloads itself, so visitors come back automatically once the app recovers. -->
  <meta http-equiv="refresh" content="20" />
  <title>GNDJ — Retour très bientôt</title>
  <style>
    :root { --navy:#1e3a5f; --teal:#2f9e8f; --ink:#1f2937; --muted:#6b7280; --bg:#f6f8fb; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:radial-gradient(1200px 600px at 50% -10%, #eaf1f8, var(--bg));
      color:var(--ink); display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card { max-width:480px; text-align:center; }
    .art { width:180px; height:auto; margin:0 auto 26px; display:block; }
    h1 { font-size:1.6rem; margin:0 0 12px; color:var(--navy); letter-spacing:-.01em; }
    p { font-size:1.02rem; line-height:1.6; color:var(--muted); margin:0 0 6px; }
    .btn {
      display:inline-block; margin-top:24px; padding:10px 22px; border-radius:10px; background:var(--navy);
      color:#fff; text-decoration:none; font-weight:600; font-size:.95rem; box-shadow:0 4px 14px rgba(30,58,95,.25);
    }
    .btn:hover { background:#274a75; }
    .sub { font-size:.82rem; color:#9aa3af; margin-top:24px; }
    .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--teal); margin-right:6px; animation:pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:.35;transform:scale(.9)} 50%{opacity:1;transform:scale(1.15)} }
  </style>
</head>
<body>
  <div class="card">
    <!-- Unplugged cable: a plug (left) disconnected from its socket (right), with a little spark. -->
    <svg class="art" viewBox="0 0 220 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M4 60 H68" stroke="#c7d2e0" stroke-width="8" stroke-linecap="round"/>
      <rect x="64" y="44" width="26" height="32" rx="7" fill="#1e3a5f"/>
      <rect x="90" y="50" width="11" height="5" rx="2.5" fill="#1e3a5f"/>
      <rect x="90" y="65" width="11" height="5" rx="2.5" fill="#1e3a5f"/>
      <path d="M216 60 H152" stroke="#c7d2e0" stroke-width="8" stroke-linecap="round"/>
      <rect x="130" y="42" width="26" height="36" rx="8" fill="#2f9e8f"/>
      <rect x="121" y="50" width="9" height="5" rx="2.5" fill="#2f9e8f"/>
      <rect x="121" y="65" width="9" height="5" rx="2.5" fill="#2f9e8f"/>
      <path d="M112 44 l-7 13 h9 l-7 15" stroke="#f4b740" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Nous revenons tout de suite</h1>
    <p>Le site rencontre un petit souci technique et sera de retour très rapidement.</p>
    <p>Merci de votre patience.</p>
    <a class="btn" href="/">Réessayer</a>
    <div class="sub"><span class="dot"></span>Cette page se rafraîchit automatiquement.</div>
  </div>
</body>
</html>
